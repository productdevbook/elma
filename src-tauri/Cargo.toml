[package]
name = "elma"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "iPhone ve iPad cihaz yöneticisi"
license = "GPL-3.0"

[lib]
name = "elma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
thiserror = "2.0.20"
tauri-plugin-dialog = "2.4.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
